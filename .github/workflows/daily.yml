name: Daily AI Frontier Radar

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions uses UTC. 00:00 UTC = 08:00 Asia/Shanghai.
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: daily-ai-frontier
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_PROVIDER: deepseek
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL_FAST: deepseek-chat
      DEEPSEEK_MODEL_SMART: deepseek-chat
      DAILY_LLM_BUDGET_RMB: "0.5"
      DAILY_TOP_N: "5"
      HTTP_TIMEOUT_SECONDS: "30"
      ALLOW_MOCK_LLM: "false"
      ENABLE_EMAIL: ${{ vars.ENABLE_EMAIL || 'false' }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      SMTP_HOST: smtp.qq.com
      SMTP_PORT: "465"
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SITE_URL: https://z977z.github.io/personal-ai-frontier-radar/

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate daily radar
        run: python main.py

      - name: Commit generated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily builds data
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "chore: generate daily radar $(date -u +%F)"
            git push
          fi
